name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        working-directory: lib
        run: npm install

      - name: Run tests
        working-directory: lib
        run: npm test

      - name: Run E2E tests
        working-directory: lib
        run: npm run test:e2e
